# Shared defaults, merged under every train / inference config.

# Model / sampling
causal: true
i2v: false
independent_first_frame: false
num_training_frames: 21
num_frame_per_block: 3          # K: temporal block size in latent frames
num_views: 2
context_noise: 0
warp_denoising_step: false
same_step_across_blocks: true
last_step_only: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 5.0
denoising_loss_type: flow
mixed_precision: true
cutt3r_method: raymap           # null disables the geometric prior
seed: 24

# Optimization
weight_decay: 0.01
gc_interval: 100
